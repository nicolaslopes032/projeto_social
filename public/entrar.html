<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="entrar.css">
</head>
<body>
    <header>
      <a href="index.html">
        <img src="img/logosnmenor.png" alt="">
      </a>
      <a class="ha" href="bibl.html">Biblioteca</a>
      <a class="ha" href="entrar.html">Funcionários</a>
    </header>

    <main>
      <div class="block">
        <form class="form" id="form-login">
          <div class="form-group">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu nome de usuário" autocomplete="off" minlength="3" pattern="^\S+$"  required />
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha" autocomplete="off" minlength="6"  required, oninput="this.value = this.value.replace(/\s/g, '')"/>
          </div>
          <p id="mensagem-erro" class="mensagem-erro"></p>
          <button type="submit" class="btn">Entrar</button>
        </form>
      </div>
    </main>

    <footer>
      <div id="foot1">
        <a href="index.html"><img src="img/logo.png" alt=""></a>
      </div>
      <div id="foot2">
        <div class="footblock">
          <div class="space"></div>
          <a class="fa" href="cred.html">
            <img width="30px" src="img/personamenor.png" alt="">
            <div>Créditos</div>
          </a>
          <div class="space"></div>
          <a class="fa" href="func.html">
            <img width="30px" src="img/employeesmenor.png" alt="">
            <div>Funcionários</div>
          </a>
        </div>
        <div class="footblock">
          <div class="space"></div>
          <a class="fa" href="https://aluno.seduc.ce.gov.br/" target="_blank" rel="external">
            <img width="30px" src="img/alunoonmenor.png" alt="">
            <div>Aluno online</div>
          </a>
        </div>
      </div>
    </footer>

    <script src="entrar.js"></script>
</body>
</html>
